[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = module
asyncio_default_test_loop_scope = module
# Without this, `scoring_service`/`rag_service` are only importable when
# pytest is invoked as `python -m pytest` (which prepends cwd to sys.path)
# -- true every time this was run locally in this project, but NOT true for
# a bare `pytest` invocation, which is what the CI workflow used. That
# mismatch passed locally and failed in CI with
# "ModuleNotFoundError: No module named 'scoring_service'" the first time
# CI actually ran. `pythonpath = .` makes this invocation-independent
# instead of relying on always remembering `-m`.
pythonpath = .
