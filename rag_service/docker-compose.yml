services:
  db:
    image: pgvector/pgvector:pg16
    container_name: finbuddy_rag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finbuddy
      POSTGRES_PASSWORD: finbuddy_dev_password
      POSTGRES_DB: finbuddy_rag
    ports:
      - "5432:5432"
    volumes:
      - finbuddy_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbuddy -d finbuddy_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finbuddy_pgvector_data:
