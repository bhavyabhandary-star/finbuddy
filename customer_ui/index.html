<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FinBuddy — Explainable Credit for Gig Workers</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<meta name="theme-color" content="#2a78d6" />
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --series-blue:    #2a78d6;
    --seq-100:        #cde2fb;
    --seq-300:        #6da7ec;
    --seq-500:        #256abf;
    --status-good:       #0ca30c;
    --status-good-text:  #006300;
    --status-warning:    #fab219;
    --status-serious:    #ec835a;
    --status-critical:   #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --series-blue:    #3987e5;
      --seq-100:        #184f95;
      --seq-300:        #2a78d6;
      --seq-500:        #86b6ef;
      --status-good:       #0ca30c;
      --status-good-text:  #0ca30c;
      --status-warning:    #fab219;
      --status-serious:    #ec835a;
      --status-critical:   #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --series-blue:    #3987e5;
    --seq-100:        #184f95;
    --seq-300:        #2a78d6;
    --seq-500:        #86b6ef;
    --status-good:       #0ca30c;
    --status-good-text:  #0ca30c;
    --status-warning:    #fab219;
    --status-serious:    #ec835a;
    --status-critical:   #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
  header { margin-bottom: 24px; }
  header h1 { margin: 0 0 4px; font-size: 1.75rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--text-secondary); font-size: 0.95rem; }
  .badge-live {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.75rem; color: var(--status-good-text);
    background: color-mix(in srgb, var(--status-good) 12%, transparent);
    border: 1px solid var(--status-good);
    padding: 2px 8px; border-radius: 999px; margin-top: 8px;
  }
  .install-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.75rem; color: var(--series-blue);
    background: transparent; border: 1px solid var(--series-blue);
    padding: 2px 10px; border-radius: 999px; margin-top: 8px; margin-left: 8px;
    cursor: pointer;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .card .hint { color: var(--text-muted); font-size: 0.85rem; margin: 0 0 16px; }

  .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .preset-btn {
    flex: 1; min-width: 140px;
    padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--page);
    color: var(--text-primary); cursor: pointer; font-size: 0.85rem; text-align: left;
  }
  .preset-btn:hover { border-color: var(--series-blue); }
  .preset-btn .emoji { font-size: 1.1rem; margin-right: 6px; }
  .preset-btn .sub { display: block; color: var(--text-muted); font-size: 0.75rem; margin-top: 2px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 4px; }
  input, select {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--page); color: var(--text-primary);
    font-size: 0.9rem; font-variant-numeric: tabular-nums;
  }
  .field { margin-bottom: 12px; }

  button.primary {
    width: 100%; padding: 12px; border-radius: 8px; border: none;
    background: var(--series-blue); color: #fff; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; margin-top: 8px;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); }

  .error-banner {
    background: color-mix(in srgb, var(--status-critical) 12%, transparent);
    border: 1px solid var(--status-critical); color: var(--text-primary);
    border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; margin-top: 12px;
  }

  .score-hero { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .score-hero .value { font-size: 2.75rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .score-hero .range { color: var(--text-muted); font-size: 0.85rem; }
  .score-bar-track { height: 8px; border-radius: 4px; background: var(--gridline); overflow: hidden; margin-bottom: 4px; }
  .score-bar-fill { height: 100%; background: linear-gradient(90deg, var(--seq-100), var(--seq-300), var(--seq-500)); border-radius: 4px; }
  .score-scale { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.7rem; margin-bottom: 16px; }

  .status-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
    margin-bottom: 14px;
  }
  .status-chip.good { color: var(--status-good-text); background: color-mix(in srgb, var(--status-good) 14%, transparent); border: 1px solid var(--status-good); }
  .status-chip.critical { color: var(--status-critical); background: color-mix(in srgb, var(--status-critical) 14%, transparent); border: 1px solid var(--status-critical); }
  .status-chip.warning { color: var(--text-primary); background: color-mix(in srgb, var(--status-warning) 20%, transparent); border: 1px solid var(--status-warning); }

  .factor { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--gridline); }
  .factor:first-child { border-top: none; }
  .factor .sign { font-weight: 700; width: 18px; flex-shrink: 0; text-align: center; font-variant-numeric: tabular-nums; }
  .factor .sign.pos { color: var(--status-good-text); }
  .factor .sign.neg { color: var(--status-critical); }
  .factor .body p { margin: 0 0 4px; font-size: 0.88rem; }
  .factor .body .action { color: var(--text-secondary); font-size: 0.8rem; }

  .meta-row { display: flex; gap: 16px; color: var(--text-muted); font-size: 0.75rem; margin-top: 14px; flex-wrap: wrap; }

  .chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; max-height: 420px; overflow-y: auto; }
  .msg { max-width: 88%; padding: 10px 12px; border-radius: 10px; font-size: 0.88rem; line-height: 1.4; }
  .msg.user { align-self: flex-end; background: var(--series-blue); color: #fff; }
  .msg.bot { align-self: flex-start; background: var(--page); border: 1px solid var(--border); }
  .msg.bot.escalate { border-color: var(--status-warning); }
  .msg .sources { margin-top: 8px; font-size: 0.72rem; color: var(--text-muted); }
  .msg .sources div { margin-top: 2px; }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row input { flex: 1; }
  .chat-input-row button { padding: 0 16px; border-radius: 8px; border: none; background: var(--series-blue); color: #fff; cursor: pointer; }
  .chat-input-row button:disabled { opacity: 0.6; }

  footer { color: var(--text-muted); font-size: 0.75rem; text-align: center; margin-top: 24px; }
  footer a { color: var(--text-secondary); }
</style>
</head>
<body class="viz-root">
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel" data-type="module">
const { useState, useRef, useEffect } = React;

const SCORING_API = "https://bhavyabhandary-finbuddy-scoring.hf.space";
const COACH_API = "https://bhavyabhandary-finbuddy-rag-coach.hf.space";

const PRESETS = {
  rajesh: {
    label: "Rajesh", emoji: "🛺", sub: "Swiggy delivery · Bengaluru",
    avg_monthly_income: 20000, income_regularity_score: 0.82, tx_count_30d: 400,
    merchant_diversity: 12, balance_dip_frequency: 2, b2b_ratio: 0.15,
    avg_transaction_size: 50, tenure_months: 6, geography: "urban",
  },
  meena: {
    label: "Meena", emoji: "🛒", sub: "Kirana store owner · Chennai",
    avg_monthly_income: 37000, income_regularity_score: 0.91, tx_count_30d: 900,
    merchant_diversity: 28, balance_dip_frequency: 0, b2b_ratio: 0.65,
    avg_transaction_size: 210, tenure_months: 12, geography: "urban",
  },
  custom: {
    label: "Custom", emoji: "✏️", sub: "Enter your own numbers",
    avg_monthly_income: 15000, income_regularity_score: 0.5, tx_count_30d: 100,
    merchant_diversity: 8, balance_dip_frequency: 3, b2b_ratio: 0.1,
    avg_transaction_size: 150, tenure_months: 3, geography: "semi_urban",
  },
};

function escapeText(str) {
  return str ?? "";
}

function InstallButton() {
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener("beforeinstallprompt", handler);
    return () => window.removeEventListener("beforeinstallprompt", handler);
  }, []);
  if (!deferredPrompt) return null;
  return (
    <button className="install-btn" onClick={async () => {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      setDeferredPrompt(null);
    }}>⬇ Install app</button>
  );
}

function ProfileForm({ onResult }) {
  const [form, setForm] = useState({ ...PRESETS.rajesh });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const setField = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const loadPreset = (name) => setForm({ ...PRESETS[name] });

  async function runAssessment() {
    setLoading(true);
    setError(null);
    const payload = {
      avg_monthly_income: Number(form.avg_monthly_income),
      income_regularity_score: Number(form.income_regularity_score),
      tx_count_30d: Number(form.tx_count_30d),
      merchant_diversity: Number(form.merchant_diversity),
      balance_dip_frequency: Number(form.balance_dip_frequency),
      b2b_ratio: Number(form.b2b_ratio),
      avg_transaction_size: Number(form.avg_transaction_size),
      tenure_months: Number(form.tenure_months),
      geography: form.geography || null,
    };
    try {
      const res = await fetch(`${SCORING_API}/api/v1/score`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`API error ${res.status}: ${await res.text()}`);
      const data = await res.json();
      onResult(data);
    } catch (err) {
      setError(`Couldn't get a score: ${err.message}`);
    } finally {
      setLoading(false);
    }
  }

  return (
    <section className="card">
      <h2>Get a credit assessment</h2>
      <p className="hint">Load an example profile or enter your own. This calls the real F-001/F-003/F-006/F-012 pipeline — trained on synthetic data (see the project README), not your real financial information.</p>

      <div className="preset-row">
        {Object.entries(PRESETS).map(([key, p]) => (
          <button key={key} className="preset-btn" onClick={() => loadPreset(key)}>
            <span className="emoji">{p.emoji}</span>{p.label}
            <span className="sub">{p.sub}</span>
          </button>
        ))}
      </div>

      <div className="grid">
        <div className="field">
          <label>Avg monthly income (₹)</label>
          <input type="number" min="1" value={form.avg_monthly_income} onChange={(e) => setField("avg_monthly_income", e.target.value)} />
        </div>
        <div className="field">
          <label>Income regularity (0–1)</label>
          <input type="number" min="0" max="1" step="0.01" value={form.income_regularity_score} onChange={(e) => setField("income_regularity_score", e.target.value)} />
        </div>
        <div className="field">
          <label>UPI transactions / 30d</label>
          <input type="number" min="0" value={form.tx_count_30d} onChange={(e) => setField("tx_count_30d", e.target.value)} />
        </div>
        <div className="field">
          <label>Merchant diversity</label>
          <input type="number" min="0" value={form.merchant_diversity} onChange={(e) => setField("merchant_diversity", e.target.value)} />
        </div>
        <div className="field">
          <label>Balance dip frequency</label>
          <input type="number" min="0" value={form.balance_dip_frequency} onChange={(e) => setField("balance_dip_frequency", e.target.value)} />
        </div>
        <div className="field">
          <label>B2B ratio (0–1)</label>
          <input type="number" min="0" max="1" step="0.01" value={form.b2b_ratio} onChange={(e) => setField("b2b_ratio", e.target.value)} />
        </div>
        <div className="field">
          <label>Avg transaction size (₹)</label>
          <input type="number" min="1" value={form.avg_transaction_size} onChange={(e) => setField("avg_transaction_size", e.target.value)} />
        </div>
        <div className="field">
          <label>Tenure (months, 1–12)</label>
          <input type="number" min="1" max="12" value={form.tenure_months} onChange={(e) => setField("tenure_months", e.target.value)} />
        </div>
        <div className="field" style={{ gridColumn: "1 / -1" }}>
          <label>Geography</label>
          <select value={form.geography} onChange={(e) => setField("geography", e.target.value)}>
            <option value="urban">Urban</option>
            <option value="semi_urban">Semi-urban</option>
            <option value="rural">Rural</option>
          </select>
          <p className="hint" style={{ marginTop: 4, marginBottom: 0 }}>Optional, but without it the fairness-mitigated decision (F-012) can't be applied — the score falls back to a plain probability threshold.</p>
        </div>
      </div>

      <button className="primary" disabled={loading} onClick={runAssessment}>
        {loading ? "Scoring…" : "Get my score"}
      </button>
      {error && <div className="error-banner">{error}</div>}
    </section>
  );
}

function ResultCard({ data }) {
  if (!data) return null;
  const pct = Math.max(0, Math.min(100, ((data.credit_score - 300) / (850 - 300)) * 100));
  return (
    <section className="card">
      <h2>Your assessment</h2>
      <div className="score-hero">
        <span className="value">{data.credit_score}</span>
        <span className="range">/ 850</span>
      </div>
      <div className="score-bar-track"><div className="score-bar-fill" style={{ width: `${pct}%` }} /></div>
      <div className="score-scale"><span>300</span><span>850</span></div>

      {data.approved
        ? <span className="status-chip good">✓ Approved</span>
        : <span className="status-chip critical">✕ Not approved</span>}
      {data.is_anomalous && (
        <div className="status-chip warning">⚠ Unusual UPI pattern detected — {escapeText(data.anomaly_note)}</div>
      )}

      <p style={{ fontSize: "0.85rem", color: "var(--text-secondary)", margin: "0 0 4px" }}>
        Calibrated probability of repayment: <b>{Math.round(data.calibrated_probability_of_repayment * 100)}%</b>
      </p>

      <h2 style={{ fontSize: "0.95rem", marginTop: 18 }}>Why this decision</h2>
      <div>
        {data.top_3_factors.map((f, i) => (
          <div className="factor" key={i}>
            <span className={`sign ${f.direction === "positive" ? "pos" : "neg"}`}>{f.direction === "positive" ? "+" : "−"}</span>
            <div className="body">
              <p>{f.plain_english}</p>
              <p className="action">{f.action}</p>
            </div>
          </div>
        ))}
      </div>

      <div className="meta-row">
        <span>Scored in {Math.round(data.latency_ms)}ms</span>
        <span>{data.fairness_mitigation_applied ? "Fairness-mitigated decision (F-012)" : "Plain threshold (no geography supplied)"}</span>
        <span>Income band: {data.income_band}</span>
      </div>
    </section>
  );
}

// Hindi strings here are NOT verified by a native speaker -- same honest
// caveat as the coach's own Hindi replies (see rag_service/main.py's
// HINDI_INSTRUCTION docstring). Kept to a small, fixed dictionary rather
// than a full i18n framework since this is the only bilingual surface in
// the app right now.
const COACH_STRINGS = {
  english: {
    heading: "Ask FinBuddy",
    hint: "Grounded in FinBuddy's real RBI/DPDP policy & coaching corpus — if it doesn't have a verified answer, it says so and hands off to a human coach instead of guessing.",
    placeholder: "e.g. why do you need my UPI data?",
    send: "Send",
  },
  hindi: {
    heading: "फिनबडी से पूछें",
    hint: "FinBuddy के असली RBI/DPDP नीति और मार्गदर्शन दस्तावेज़ों पर आधारित — अगर कोई सत्यापित जवाब नहीं है, तो यह अनुमान लगाने के बजाय साफ बताता है और मानव सहायक से जोड़ देता है। (हिंदी अनुवाद मानव-सत्यापित नहीं है)",
    placeholder: "जैसे: मेरा UPI डेटा क्यों चाहिए?",
    send: "भेजें",
  },
};

function CoachChat({ lastScoreResult }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [language, setLanguage] = useState("english");
  const logRef = useRef(null);
  const t = COACH_STRINGS[language];

  useEffect(() => {
    if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [messages]);

  async function sendChat() {
    const query = input.trim();
    if (!query) return;
    setMessages((m) => [...m, { role: "user", text: query }]);
    setInput("");
    setSending(true);

    const payload = { user_query: query, response_language: language };
    if (lastScoreResult) {
      payload.f001_credit_score = lastScoreResult.credit_score;
      payload.f003_shap_top_3 = lastScoreResult.top_3_factors.map(
        (f) => `${f.factor}: ${f.direction === "positive" ? "+" : "-"}`
      );
    }

    try {
      const res = await fetch(`${COACH_API}/api/v1/whatsapp-coach/respond`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      setMessages((m) => [...m, { role: "bot", text: data.answer, escalate: data.escalate_to_human, sources: data.sources }]);
    } catch (err) {
      setMessages((m) => [...m, { role: "bot", text: `Something went wrong reaching FinBuddy: ${err.message}`, escalate: true, sources: [] }]);
    } finally {
      setSending(false);
    }
  }

  return (
    <section className="card">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <h2 style={{ margin: 0 }}>{t.heading}</h2>
        <div className="preset-row" style={{ marginBottom: 0, flexShrink: 0, width: "auto" }}>
          <button
            className="preset-btn"
            style={{ minWidth: 0, flex: "none", fontWeight: language === "english" ? 700 : 400, borderColor: language === "english" ? "var(--series-blue)" : "var(--border)" }}
            onClick={() => setLanguage("english")}
          >English</button>
          <button
            className="preset-btn"
            style={{ minWidth: 0, flex: "none", fontWeight: language === "hindi" ? 700 : 400, borderColor: language === "hindi" ? "var(--series-blue)" : "var(--border)" }}
            onClick={() => setLanguage("hindi")}
          >हिंदी</button>
        </div>
      </div>
      <p className="hint">{t.hint}</p>
      <div className="chat-log" ref={logRef}>
        {messages.map((m, i) =>
          m.role === "user"
            ? <div className="msg user" key={i}>{m.text}</div>
            : (
              <div className={`msg bot ${m.escalate ? "escalate" : ""}`} key={i}>
                {m.text}
                {m.sources && m.sources.length > 0 && (
                  <div className="sources">
                    {m.sources.map((s, j) => (
                      <div key={j}>📄 {s.source_file.split(/[\\/]/).pop()} ({Math.round(s.similarity * 100)}% match)</div>
                    ))}
                  </div>
                )}
              </div>
            )
        )}
      </div>
      <div className="chat-input-row">
        <input
          type="text"
          placeholder={t.placeholder}
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") sendChat(); }}
        />
        <button disabled={sending} onClick={sendChat}>{t.send}</button>
      </div>
    </section>
  );
}

function App() {
  const [scoreResult, setScoreResult] = useState(null);

  return (
    <div className="wrap">
      <header>
        <h1>FinBuddy</h1>
        <p>Explainable credit for gig-economy workers, scored from real UPI signals.</p>
        <span className="badge-live">● Live — calls the real scoring &amp; coaching APIs, not a mock</span>
        <InstallButton />
      </header>

      <ProfileForm onResult={setScoreResult} />
      <ResultCard data={scoreResult} />
      <CoachChat lastScoreResult={scoreResult} />

      <footer>
        <a href="https://bhavyabhandary-finbuddy-scoring.hf.space/docs" target="_blank" rel="noreferrer">Scoring API docs</a>
        &nbsp;·&nbsp;
        <a href="https://bhavyabhandary-finbuddy-rag-coach.hf.space/docs" target="_blank" rel="noreferrer">Coach API docs</a>
        &nbsp;·&nbsp;
        <a href="https://github.com/bhavyabhandary-star/finbuddy" target="_blank" rel="noreferrer">Source</a>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW registration failed:", err));
  });
}
</script>
</body>
