# FinBuddy CI/CD: Gate A (MLOps governance) + Gate B (RAG quality) must both
# pass before any deploy happens -- build-and-deploy declares `needs: test`
# so a failing test blocks deployment outright, not just a logged warning.
#
# REQUIRED GitHub Secrets before this workflow can actually deploy (test job
# runs fine without them for the parts that don't need external services --
# see the test job's own notes):
#   DATABASE_URL   -- Neon/Supabase Postgres connection string (pgvector),
#                      with knowledge_corpus already populated
#   GROQ_API_KEY   -- console.groq.com free API key
#   HF_TOKEN       -- HuggingFace access token with write access, for pushing
#                      to the two Spaces below
#   HF_USERNAME    -- your HuggingFace username (Spaces are pushed to
#                      huggingface.co/spaces/<HF_USERNAME>/finbuddy-scoring
#                      and .../finbuddy-rag-coach -- create both Spaces
#                      first, Docker SDK, before this workflow can push to
#                      them)
#
# Until those secrets exist, `test` still runs (Gate A always works; Gate
# B's real-Groq tests skip cleanly without GROQ_API_KEY/DATABASE_URL, same
# as running locally) but `build-and-deploy` will fail at the push step.

name: FinBuddy CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Regenerate synthetic training data
        # scoring_service/data/*.csv is gitignored (regenerable, kept out of
        # the repo deliberately) -- Gate A's tests need it to reconstruct the
        # same train/test split the committed models were evaluated against.
        # The generator is fully deterministic (fixed seed) -- verified this
        # produces byte-identical output to what trained the committed model
        # artifacts, so this is not a "different data, different result" risk.
        run: python -m scoring_service.data.generate_synthetic_upi_data

      - name: Run Gate A (MLOps governance) + Gate B (RAG quality)
        run: pytest tests/ -v

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOT using `git subtree push` (tried, twice) -- two real failures in a
      # row: (1) a freshly-created HF Space auto-generates an initial commit,
      # so a plain push is rejected as non-fast-forward; (2) subtree push
      # carries this repo's FULL history, where scoring_service's .joblib
      # model artifacts were committed as plain git blobs -- HF's server
      # rejects that outright ("push was rejected because it contains binary
      # files ... use Git LFS"). Building a fresh, single-commit, properly
      # LFS-tracked snapshot of each service directory sidesteps both: no
      # inherited history to conflict with, and binaries go through LFS from
      # the very first commit of this snapshot repo.
      - name: Deploy scoring_service to its HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          rm -rf /tmp/deploy-scoring && mkdir -p /tmp/deploy-scoring
          cp -r scoring_service/. /tmp/deploy-scoring/
          find /tmp/deploy-scoring -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          cd /tmp/deploy-scoring
          git init -q -b main
          git config user.email "ci@finbuddy.local"
          git config user.name "FinBuddy CI"
          git lfs install --local
          git lfs track "*.joblib"
          git add -A
          git commit -q -m "Deploy scoring_service from finbuddy@${GITHUB_SHA}"
          git push "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/finbuddy-scoring" HEAD:main --force

      - name: Deploy rag_service to its HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          rm -rf /tmp/deploy-rag && mkdir -p /tmp/deploy-rag
          cp -r rag_service/. /tmp/deploy-rag/
          find /tmp/deploy-rag -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          cd /tmp/deploy-rag
          git init -q -b main
          git config user.email "ci@finbuddy.local"
          git config user.name "FinBuddy CI"
          git add -A
          git commit -q -m "Deploy rag_service from finbuddy@${GITHUB_SHA}"
          git push "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/finbuddy-rag-coach" HEAD:main --force

  drift-report:
    # Best-effort only: NOT verified from the dev session that wrote this
    # (evidently broke pandas locally via a blocked DLL, so this could only
    # be written against evidently's documented API, never actually run).
    # continue-on-error so a failure here never blocks test or deploy --
    # the pure-numpy PSI+CUSUM report (drift_report.py) is the tested,
    # trusted one; this is the literal-Evidently-package bonus artifact.
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install scoring_service deps + evidently
        run: |
          pip install -r scoring_service/requirements.txt
          pip install -r scoring_service/monitoring/requirements-evidently-ci.txt
      - name: Regenerate synthetic training data
        # Same reason as the test job -- drift_report.py's reference
        # distribution comes from this gitignored, regenerable CSV.
        run: python -m scoring_service.data.generate_synthetic_upi_data
      - name: Generate tested PSI+CUSUM drift reports (always works)
        run: python -m scoring_service.monitoring.drift_report
      - name: Generate literal Evidently dashboard (best-effort, unverified)
        run: python -m scoring_service.monitoring.drift_report_evidently_ci
      - uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: scoring_service/monitoring/reports/
